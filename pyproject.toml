[project]
name = "esw"
version = "0.1.0"
description = "ETF Arbitrage-Stress Early Warning System (research prototype)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=15",
    "duckdb>=1.0",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "lightgbm>=4.3",
    "shap>=0.45",
    "pandera>=0.20",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "requests>=2.31",
    "tenacity>=8.2",
    "openpyxl>=3.1",
    "exchange_calendars>=4.5",
    "bidask>=2.0",
    "matplotlib>=3.8",
    "plotly>=5.20",
    "jinja2>=3.1",
    "streamlit>=1.35",
    "typer>=0.12",
    "python-calamine>=0.9.1",
    "tabulate>=0.10.0",
]

[project.optional-dependencies]
fallback = ["yfinance>=0.2.40"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5"]

[project.scripts]
esw = "esw.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/esw"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["docs", "archive", "records", "reports"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501"]  # line length is handled by the formatter; long strings are allowed

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "slow: long-running tests",
    "network: needs internet access (skipped unless ESW_ALLOW_NETWORK=1)",
    "acceptance: phase acceptance tests",
]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Argument", "typer.Option"]
