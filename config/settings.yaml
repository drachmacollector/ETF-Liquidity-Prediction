# ESW settings. Parameter names and defaults follow System Specification §4.13.
# Parameters marked "frozen at P11" must not change after the pre-registration is signed (MI-11).

paths:                       # relative to the repository root (System Specification §3)
  config: config
  reference: reference
  data: data
  raw: data/raw
  manual_drop: data/manual_drop
  staged: data/staged
  curated: data/curated
  derived: data/derived
  manifests: data/manifests
  runs: runs
  models: models
  outputs: outputs
  reports: reports
  logs: logs
  records: records

params:
  ABS_FLOOR_BPS: 200          # §4.6 absolute floor of the dislocation threshold      (frozen at P11)
  K_MULT: 3.0                 # §4.6 multiple of robust scale                          (frozen at P11)
  PERSIST_MIN: 3              # §4.6 minimum dislocation days per episode              (frozen at P11)
  GAP_BRIDGE: 1               # §4.6 max non-DD days bridged inside an episode         (frozen at P11)
  HORIZON: 5                  # §4.7 primary forecast horizon, trading days            (frozen at P11)
  BASE_WIN: 60                # §4.5 baseline window                                   (frozen at P11)
  BASE_MIN: 40                # §4.5 baseline minimum observations                     (frozen at P11)
  SCALE_WIN: 250              # §4.5 scale window                                      (frozen at P11)
  SCALE_MIN: 120              # §4.5 scale minimum observations                        (frozen at P11)
  SCALE_FLOOR_BPS: 5          # §4.5 floor on robust scale                             (frozen at P11)
  FREEZE_MAX: 60              # §4.6 max baseline freeze before structural absorption  (frozen at P11)
  COOLDOWN: 5                 # §4.7 ineligible days after an episode end              (frozen at P11)
  EMBARGO: 10                 # §4.7/§9 train-test embargo, trading days               (frozen at P11)
  SEC_ABS_BPS: 200            # §4.8 SEC-style secondary label                         (frozen at P11)
  SEC_RUN: 8                  # §4.8                                                   (frozen at P11)
  SEBI_ABS_BPS: 100           # §4.8 SEBI-style secondary label                        (frozen at P11)
  SEBI_RUN: 7                 # §4.8                                                   (frozen at P11)
  LEAD_WINDOW: 5              # §4.8 window for counting a warning                     (frozen at P11)
  DEV_END: 2019-12-31         # §9 last date of the development period (US)            (frozen at P11)
  LOCKBOX_START: 2020-01-01   # §9 first date of the US lockbox                        (frozen at P11)
  DATA_CUTOFF: null           # set in P07                                             (frozen at P11)
  ALERT_BUDGET_HIGH: 1.0      # max HIGH alert chains per eligible ETF-quarter outside episodes (frozen at P11)
  ALERT_BUDGET_WATCH: 1.0     # max WATCH+ alert chains per eligible ETF-month outside episodes (frozen at P11)
  THR_WATCH: null             # set in P12                                             (frozen before lockbox)
  THR_HIGH: null              # set in P12                                             (frozen before lockbox)
  SEED: 20261117              # global random seed
  BOOT_BLOCK: month           # §9 bootstrap block                                     (frozen at P11)
  BOOT_N: 2000                # §9 bootstrap replicates                                (frozen at P11)

sensitivity_grid:             # §4.13, used in P09 (labels) and P14 (evaluation)
  ABS_FLOOR_BPS: [100, 200, 300]
  K_MULT: [2.5, 3.0, 4.0]
  PERSIST_MIN: [2, 3, 5]
  HORIZON: [1, 3, 5]

http:                         # §11 polite data access
  user_agent_env: ESW_USER_AGENT
  default_user_agent: esw-research-bot/0.1
  min_seconds_between_requests: 1.0
  max_retries: 5
  backoff_base_seconds: 2.0
  timeout_seconds: 60

runtime:
  num_threads: 4

sources:                      # confirmed in P01 (reports/data/source_probe_report.md; reference/source_registry.csv)
  us_prices:
    order: [us_px_tiingo, us_px_yf]
    tiingo_url: https://api.tiingo.com/tiingo/daily/{ticker}/prices
    tiingo_headers: {Content-Type: application/json}   # plus Authorization: Token <TIINGO_API_KEY>
    tiingo_requests_per_hour: 45                        # free tier ~50/hour; stay below
  us_nav:
    spdr_gold: https://api.spdrgoldshares.com/api/v1/historical-archive?product={product}&exchange=NYSE&lang=en
    ishares_screener: https://www.ishares.com/us/product-screener/product-screener-v3.1.jsn?dcrPath=/templatedata/config/product-screener-v3/data/en/us-ishares/ishares-product-screener-backend-config&siteEntryPassthrough=true
    ishares_download: https://www.blackrock.com/varnish-api/blk-one01-product-data/product-data/api/v1/get-fund-document?appType=PRODUCT_PAGE&appSubType=ISHARES&targetSite=us-ishares&locale=en_US&portfolioId={pid}&component=fundDownload&userType=individual
    ssga_navhist: https://www.ssga.com/us/en/intermediary/library-content/products/fund-data/etfs/us/navhist-us-en-{ticker}.xlsx
    manual_drop_sources: [us_iss_uscf, us_iss_invesco, us_iss_globalx, us_iss_xtrackers, us_iss_abrdn, us_iss_teucrium, us_iss_vanguard]
  sec_edgar:
    submissions: https://data.sec.gov/submissions/CIK{cik10}.json
    max_requests_per_second: 5
  india_prices:
    nse_archive_host: https://nsearchives.nseindia.com/content   # P02 (D-010): browser-like client; full archive from 2007
    udiff_from: 2024-07-08
    udiff_path: /cm/BhavCopy_NSE_CM_0_0_0_{yyyymmdd}_F_0000.csv.zip
    legacy_path: /historical/EQUITIES/{yyyy}/{MON}/cm{dd}{MON}{yyyy}bhav.csv.zip
    archive_scriptable_from: 2007-01-01                 # P01 found 403 before 2016 on archives.nseindia.com; the nsearchives host serves 2007+
    legacy_isin_from: 2011-07-01                        # earlier legacy files have no ISIN column (map by symbol)
    bse_bhav: https://www.bseindia.com/download/BhavCopy/Equity/BhavCopy_BSE_CM_0_0_0_{yyyymmdd}_F_0000.CSV   # browser-like client + Referer
    raw_dir: data/raw/in_bhav/{yyyy}/
    min_seconds_between_requests: 2.0
  india_nav:
    order: [in_amfi_hist, in_mfapi]
    amfi_api: https://www.amfiindia.com/api/nav-history   # query_type=historical_period (max 5 years) | all_for_date; data from 2010-01-01
    amfi_navall: https://portal.amfiindia.com/spages/NAVAll.txt
    mfapi: https://api.mfapi.in/mf/{scheme_code}
    upload_time_tz: Asia/Kolkata                         # AMFI labels upload times "Z" but they are IST
  india_spot:
    sources: [in_spot_mcx, in_spot_ibja]                  # MCX polled spot received via MI-05 (2005-2026); automate refresh in P05 (D-010)
  india_vix: yfinance ^INDIAVIX
  market:
    fred_csv: https://fred.stlouisfed.org/graph/fredgraph.csv?id={series_id}
    eia_xls: https://www.eia.gov/dnav/{area}/hist_xls/{code}d.xls  # ends 2024-04-05
    yfinance_contracts_after: 2024-04-05
    credit_spread_series: BAA10Y                          # ICE BofA OAS truncated on FRED
