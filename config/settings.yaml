# ESW settings. Parameter names and defaults follow System Specification §4.13.
# Parameters marked "frozen at P11" must not change after the pre-registration is signed (MI-11).

paths:                       # relative to the repository root (System Specification §3)
  config: config
  reference: reference
  data: data
  raw: data/raw
  manual_drop: data/manual_drop
  staged: data/staged
  curated: data/curated
  derived: data/derived
  manifests: data/manifests
  runs: runs
  models: models
  outputs: outputs
  reports: reports
  logs: logs
  records: records

params:
  ABS_FLOOR_BPS: 200          # §4.6 absolute floor of the dislocation threshold      (frozen at P11)
  K_MULT: 3.0                 # §4.6 multiple of robust scale                          (frozen at P11)
  PERSIST_MIN: 3              # §4.6 minimum dislocation days per episode              (frozen at P11)
  GAP_BRIDGE: 1               # §4.6 max non-DD days bridged inside an episode         (frozen at P11)
  HORIZON: 5                  # §4.7 primary forecast horizon, trading days            (frozen at P11)
  BASE_WIN: 60                # §4.5 baseline window                                   (frozen at P11)
  BASE_MIN: 40                # §4.5 baseline minimum observations                     (frozen at P11)
  SCALE_WIN: 250              # §4.5 scale window                                      (frozen at P11)
  SCALE_MIN: 120              # §4.5 scale minimum observations                        (frozen at P11)
  SCALE_FLOOR_BPS: 5          # §4.5 floor on robust scale                             (frozen at P11)
  FREEZE_MAX: 60              # §4.6 max baseline freeze before structural absorption  (frozen at P11)
  COOLDOWN: 5                 # §4.7 ineligible days after an episode end              (frozen at P11)
  EMBARGO: 10                 # §4.7/§9 train-test embargo, trading days               (frozen at P11)
  SEC_ABS_BPS: 200            # §4.8 SEC-style secondary label                         (frozen at P11)
  SEC_RUN: 8                  # §4.8                                                   (frozen at P11)
  SEBI_ABS_BPS: 100           # §4.8 SEBI-style secondary label                        (frozen at P11)
  SEBI_RUN: 7                 # §4.8                                                   (frozen at P11)
  LEAD_WINDOW: 5              # §4.8 window for counting a warning                     (frozen at P11)
  DEV_END: 2019-12-31         # §9 last date of the development period (US)            (frozen at P11)
  LOCKBOX_START: 2020-01-01   # §9 first date of the US lockbox                        (frozen at P11)
  DATA_CUTOFF: null           # set in P07                                             (frozen at P11)
  ALERT_BUDGET_HIGH: 1.0      # max HIGH alert chains per eligible ETF-quarter outside episodes (frozen at P11)
  ALERT_BUDGET_WATCH: 1.0     # max WATCH+ alert chains per eligible ETF-month outside episodes (frozen at P11)
  THR_WATCH: null             # set in P12                                             (frozen before lockbox)
  THR_HIGH: null              # set in P12                                             (frozen before lockbox)
  SEED: 20261117              # global random seed
  BOOT_BLOCK: month           # §9 bootstrap block                                     (frozen at P11)
  BOOT_N: 2000                # §9 bootstrap replicates                                (frozen at P11)

sensitivity_grid:             # §4.13, used in P09 (labels) and P14 (evaluation)
  ABS_FLOOR_BPS: [100, 200, 300]
  K_MULT: [2.5, 3.0, 4.0]
  PERSIST_MIN: [2, 3, 5]
  HORIZON: [1, 3, 5]

http:                         # §11 polite data access
  user_agent_env: ESW_USER_AGENT
  default_user_agent: esw-research-bot/0.1
  min_seconds_between_requests: 1.0
  max_retries: 5
  backoff_base_seconds: 2.0
  timeout_seconds: 60

runtime:
  num_threads: 4

sources: {}                   # filled in P01 (source registry, URL patterns, fallbacks)
