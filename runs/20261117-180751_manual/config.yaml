paths:
  config: config
  reference: reference
  data: data
  raw: data/raw
  manual_drop: data/manual_drop
  staged: data/staged
  curated: data/curated
  derived: data/derived
  manifests: data/manifests
  runs: runs
  models: models
  outputs: outputs
  reports: reports
  logs: logs
  records: records
params:
  ABS_FLOOR_BPS: 200.0
  K_MULT: 3.0
  PERSIST_MIN: 3
  GAP_BRIDGE: 1
  HORIZON: 5
  BASE_WIN: 60
  BASE_MIN: 40
  SCALE_WIN: 250
  SCALE_MIN: 120
  SCALE_FLOOR_BPS: 5.0
  FREEZE_MAX: 60
  COOLDOWN: 5
  EMBARGO: 10
  SEC_ABS_BPS: 200.0
  SEC_RUN: 8
  SEBI_ABS_BPS: 100.0
  SEBI_RUN: 7
  LEAD_WINDOW: 5
  DEV_END: '2019-12-31'
  LOCKBOX_START: '2020-01-01'
  DATA_CUTOFF: null
  ALERT_BUDGET_HIGH: 1.0
  ALERT_BUDGET_WATCH: 1.0
  THR_WATCH: null
  THR_HIGH: null
  SEED: 20261117
  BOOT_BLOCK: month
  BOOT_N: 2000
sensitivity_grid:
  ABS_FLOOR_BPS:
  - 100.0
  - 200.0
  - 300.0
  K_MULT:
  - 2.5
  - 3.0
  - 4.0
  PERSIST_MIN:
  - 2
  - 3
  - 5
  HORIZON:
  - 1
  - 3
  - 5
http:
  user_agent_env: ESW_USER_AGENT
  default_user_agent: esw-research-bot/0.1
  min_seconds_between_requests: 1.0
  max_retries: 5
  backoff_base_seconds: 2.0
  timeout_seconds: 60.0
runtime:
  num_threads: 4
sources:
  us_prices:
    order:
    - us_px_tiingo
    - us_px_yf
    tiingo_url: https://api.tiingo.com/tiingo/daily/{ticker}/prices
    tiingo_headers:
      Content-Type: application/json
    tiingo_requests_per_hour: 45
  us_nav:
    spdr_gold: https://api.spdrgoldshares.com/api/v1/historical-archive?product={product}&exchange=NYSE&lang=en
    ishares_screener: https://www.ishares.com/us/product-screener/product-screener-v3.1.jsn?dcrPath=/templatedata/config/product-screener-v3/data/en/us-ishares/ishares-product-screener-backend-config&siteEntryPassthrough=true
    ishares_download: https://www.blackrock.com/varnish-api/blk-one01-product-data/product-data/api/v1/get-fund-document?appType=PRODUCT_PAGE&appSubType=ISHARES&targetSite=us-ishares&locale=en_US&portfolioId={pid}&component=fundDownload&userType=individual
    ssga_navhist: https://www.ssga.com/us/en/intermediary/library-content/products/fund-data/etfs/us/navhist-us-en-{ticker}.xlsx
    manual_drop_sources:
    - us_iss_uscf
    - us_iss_invesco
    - us_iss_globalx
    - us_iss_xtrackers
    - us_iss_abrdn
    - us_iss_teucrium
    - us_iss_vanguard
  sec_edgar:
    submissions: https://data.sec.gov/submissions/CIK{cik10}.json
    max_requests_per_second: 5
  india_prices:
    nse_archive_host: https://archives.nseindia.com/content
    udiff_from: '2024-07-08'
    udiff_path: /cm/BhavCopy_NSE_CM_0_0_0_{yyyymmdd}_F_0000.csv.zip
    legacy_path: /historical/EQUITIES/{yyyy}/{MON}/cm{dd}{MON}{yyyy}bhav.csv.zip
    archive_scriptable_from: '2016-01-01'
    pre_2016_fallback: yfinance (.NS symbols, from 2009 for some ETFs) or manual (MI-05)
    min_seconds_between_requests: 2.0
  india_nav:
    order:
    - in_amfi_hist
    - in_mfapi
    amfi_api: https://www.amfiindia.com/api/nav-history
    amfi_navall: https://portal.amfiindia.com/spages/NAVAll.txt
    mfapi: https://api.mfapi.in/mf/{scheme_code}
    upload_time_tz: Asia/Kolkata
  india_spot:
    sources:
    - in_spot_mcx
    - in_spot_ibja
  india_vix: yfinance ^INDIAVIX
  market:
    fred_csv: https://fred.stlouisfed.org/graph/fredgraph.csv?id={series_id}
    eia_xls: https://www.eia.gov/dnav/{area}/hist_xls/{code}d.xls
    yfinance_contracts_after: '2024-04-05'
    credit_spread_series: BAA10Y
